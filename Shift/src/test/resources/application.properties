spring.application.name=Shift

# 기존 application.properties에서 DB 연결 정보만 복사
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=test
spring.datasource.password=test

# JPA
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none

# JWT — 테스트용 더미값
jwt.secret=testSecretKeyForTestingPurposeOnly1234567890
jwt.algorithm=HS256
jwt.access-token-validity-ms=1800000
jwt.refresh-token-validity-ms=604800000

# CORS — 테스트용 더미값
cors.allowed-origins=http://localhost:3000

# S3 — 테스트용 더미값
cloud.aws.credentials.access-key=test
cloud.aws.credentials.secret-key=test
cloud.aws.s3.bucket=test
cloud.aws.region=ap-northeast-2
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB