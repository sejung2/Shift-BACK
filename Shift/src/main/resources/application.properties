spring.application.name=Shift

#database connection
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# DB
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.hibernate.ddl-auto=validate

# JWT_SECRET from environment or default for local dev
jwt.secret=${JWT_SECRET}
jwt.algorithm=HS256
jwt.access-token-validity-ms=1800000
jwt.refresh-token-validity-ms=604800000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGIN}

# S3
cloud.aws.credentials.access-key=${S3_ACCESS_KEY:dummy}
cloud.aws.credentials.secret-key=${S3_SECRET_KEY:dummy}
cloud.aws.s3.bucket=${S3_BUCKET_NAME:dummy}
cloud.aws.region=ap-northeast-2

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# google oauth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email